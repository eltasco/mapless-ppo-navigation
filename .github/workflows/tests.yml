name: Python tests
on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: python -m pip install -e ".[test]"
      - run: python -m pytest
      - run: python -m compileall -q src run.py
      - name: Smoke-test released checkpoint inference
        run: python run.py benchmark --controllers both --difficulty hard --obstacles 2 --episodes 2 --csv results/ci_smoke.csv --json results/ci_smoke.json
      - name: Checkpoint and baseline behavior
        run: python -m pytest tests/test_checkpoint.py tests/test_baseline_behavior.py tests/test_benchmarks.py
      - name: Smoke-test 19D stress and legacy baseline
        run: python run.py benchmark --controllers potential_legacy --history single --layout uniform --difficulty hard --obstacles 2 --episodes 1 --csv results/ci_legacy.csv --json results/ci_legacy.json
